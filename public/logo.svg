<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="65%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Chrome / Steel Ring Gradient -->
    <linearGradient id="metalRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4d4d8" />
      <stop offset="25%" stop-color="#71717a" />
      <stop offset="50%" stop-color="#f4f4f5" />
      <stop offset="75%" stop-color="#3f3f46" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>

    <!-- Fiery Red Ring Gradient -->
    <linearGradient id="fireRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="30%" stop-color="#dc2626" />
      <stop offset="70%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Flame Gradients -->
    <linearGradient id="flameBack" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="80%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="flameMid" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="35%" stop-color="#ea580c" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="flameCore" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Bun Gradient -->
    <radialGradient id="bunGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="45%" stop-color="#27272a" />
      <stop offset="80%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>

    <!-- Cheese Gradient -->
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Burger Text Red Gradient -->
    <linearGradient id="redTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="25%" stop-color="#ef4444" />
      <stop offset="70%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Text Path for Circular Slogan -->
    <path id="bottomArcPath" d="M 115 350 A 185 185 0 0 0 385 350" fill="none" />
  </defs>

  <!-- Deep Black Base -->
  <rect width="500" height="500" fill="#000000" rx="30" />

  <!-- Side Grunge Slash & Splatters -->
  <g opacity="0.85">
    <!-- Left red brush slash -->
    <path d="M 35 345 L 140 330 L 125 350 L 50 365 Z" fill="#dc2626" opacity="0.8" />
    <path d="M 55 320 L 115 312 L 105 324 L 40 332 Z" fill="#991b1b" opacity="0.6" />
    <path d="M 25 360 L 95 352 L 80 365 L 15 372 Z" fill="#ef4444" opacity="0.5" />
    
    <!-- Right red brush slash -->
    <path d="M 360 270 L 470 262 L 485 275 L 375 285 Z" fill="#dc2626" opacity="0.9" />
    <path d="M 380 290 L 460 285 L 450 296 L 390 302 Z" fill="#ef4444" opacity="0.7" />
    <path d="M 370 248 L 445 240 L 435 250 L 385 258 Z" fill="#991b1b" opacity="0.6" />
    <path d="M 395 315 L 475 310 L 460 322 L 405 326 Z" fill="#dc2626" opacity="0.5" />

    <!-- Embers -->
    <circle cx="95" cy="180" r="3.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="115" cy="140" r="2.5" fill="#ea580c" opacity="0.7" />
    <circle cx="395" cy="150" r="3" fill="#f59e0b" opacity="0.8" />
    <circle cx="410" cy="190" r="2" fill="#ef4444" opacity="0.9" />
    <circle cx="250" cy="40" r="3" fill="#fef08a" opacity="0.9" />
  </g>

  <!-- BACKGROUND FLAMES (behind circle top) -->
  <g filter="url(#flameGlow)">
    <!-- Back broad flames -->
    <path d="M 140 220 C 130 150 160 100 190 70 C 195 100 205 110 215 90 C 225 70 245 35 250 25 C 255 35 275 70 285 90 C 295 110 305 100 310 70 C 340 100 370 150 360 220 Z" fill="url(#flameBack)" opacity="0.95" />
    <!-- Mid flames -->
    <path d="M 160 210 C 150 160 180 120 205 95 C 212 115 222 120 230 100 C 240 80 250 50 250 45 C 252 50 262 80 272 100 C 280 120 290 115 297 95 C 322 120 352 160 342 210 Z" fill="url(#flameMid)" />
    <!-- Core intense hot flames -->
    <path d="M 195 200 C 190 165 210 135 225 115 C 232 130 240 130 245 115 C 250 95 250 80 250 75 C 252 80 255 95 260 115 C 265 130 273 130 280 115 C 295 135 315 165 310 200 Z" fill="url(#flameCore)" />
  </g>

  <!-- CIRCULAR BADGE -->
  <!-- Outer glowing red ring -->
  <circle cx="250" cy="275" r="195" fill="none" stroke="url(#fireRing)" stroke-width="7" filter="url(#softGlow)" />
  <circle cx="250" cy="275" r="195" fill="none" stroke="#ef4444" stroke-width="2.5" />

  <!-- Metallic chrome outer ring -->
  <circle cx="250" cy="275" r="185" fill="none" stroke="url(#metalRing)" stroke-width="6" />
  
  <!-- Metallic inner thin accent -->
  <circle cx="250" cy="275" r="176" fill="none" stroke="#71717a" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.7" />

  <!-- Deep black circle interior -->
  <circle cx="250" cy="275" r="172" fill="url(#bgGrad)" />

  <!-- INNER FLAMES & GLOW ON TOP OF CIRCLE -->
  <g filter="url(#softGlow)">
    <path d="M 175 220 C 170 175 195 140 215 125 C 220 140 228 140 234 130 C 242 115 250 95 250 90 C 252 95 260 115 268 130 C 274 140 282 140 287 125 C 307 140 332 175 327 220 Z" fill="url(#flameMid)" opacity="0.9" />
    <path d="M 205 210 C 200 180 220 155 235 140 C 242 150 250 150 252 140 C 265 155 285 180 280 210 Z" fill="url(#flameCore)" />
  </g>

  <!-- ARTISANAL BURGER (Center Top) -->
  <g transform="translate(0, 5)">
    <!-- Burger Shadow/Glow -->
    <ellipse cx="250" cy="215" rx="90" ry="18" fill="#000000" opacity="0.8" />

    <!-- Bottom Bun -->
    <path d="M 172 208 C 172 218 200 224 250 224 C 300 224 328 218 328 208 C 328 205 310 203 250 203 C 190 203 172 205 172 208 Z" fill="#27272a" stroke="#18181b" stroke-width="1.5" />
    
    <!-- Melted Cheddar Dripping Layer -->
    <path d="M 166 198 Q 185 204 205 199 Q 215 212 225 200 Q 240 205 255 199 Q 268 214 280 200 Q 305 204 334 198 Q 320 208 250 210 Q 180 208 166 198 Z" fill="url(#cheeseGrad)" />

    <!-- Meat Patty with flame grill char -->
    <path d="M 164 188 C 164 196 170 202 185 203 C 215 205 285 205 315 203 C 330 202 336 196 336 188 C 336 184 325 182 250 182 C 175 182 164 184 164 188 Z" fill="#1c1917" stroke="#44403c" stroke-width="1" />
    <!-- Grill highlights on patty -->
    <line x1="190" y1="188" x2="220" y2="198" stroke="#78350f" stroke-width="2" opacity="0.7" />
    <line x1="235" y1="188" x2="265" y2="198" stroke="#78350f" stroke-width="2" opacity="0.7" />
    <line x1="280" y1="188" x2="310" y2="198" stroke="#78350f" stroke-width="2" opacity="0.7" />

    <!-- Top Charcoal / Dark Brioche Bun with 3D curve -->
    <path d="M 165 184 C 165 140 200 130 250 130 C 300 130 335 140 335 184 C 335 189 310 193 250 193 C 190 193 165 189 165 184 Z" fill="url(#bunGrad)" stroke="#3f3f46" stroke-width="1.5" />
    
    <!-- Bun Shine / Highlight -->
    <ellipse cx="230" cy="148" rx="45" ry="12" fill="#ffffff" opacity="0.16" transform="rotate(-8 230 148)" />

    <!-- Sesame Seeds on Bun -->
    <g fill="#fef08a" opacity="0.95">
      <ellipse cx="220" cy="145" rx="3" ry="1.5" transform="rotate(-15 220 145)" />
      <ellipse cx="245" cy="142" rx="3" ry="1.5" transform="rotate(10 245 142)" />
      <ellipse cx="270" cy="146" rx="3" ry="1.5" transform="rotate(25 270 146)" />
      <ellipse cx="235" cy="158" rx="3.2" ry="1.6" transform="rotate(-5 235 158)" />
      <ellipse cx="260" cy="156" rx="3" ry="1.5" transform="rotate(15 260 156)" />
      <ellipse cx="285" cy="159" rx="2.8" ry="1.4" transform="rotate(30 285 159)" />
      <ellipse cx="205" cy="156" rx="2.8" ry="1.4" transform="rotate(-25 205 156)" />
      <ellipse cx="218" cy="168" rx="3" ry="1.5" transform="rotate(-10 218 168)" />
      <ellipse cx="248" cy="170" rx="3.2" ry="1.6" transform="rotate(5 248 170)" />
      <ellipse cx="278" cy="170" rx="3" ry="1.5" transform="rotate(20 278 170)" />
      <ellipse cx="300" cy="168" rx="2.8" ry="1.4" transform="rotate(35 300 168)" />
      <ellipse cx="190" cy="167" rx="2.8" ry="1.4" transform="rotate(-30 190 167)" />
    </g>
  </g>

  <!-- MAIN TYPOGRAPHY: "Eller's" (Brush script, angled, white with dynamic drop-shadow) -->
  <g transform="translate(245, 275) rotate(-3)">
    <!-- Deep Drop Shadow -->
    <text x="3" y="3" text-anchor="middle" font-family="'Brush Script MT', 'Outfit', 'Plus Jakarta Sans', cursive, sans-serif" font-size="86" font-weight="900" font-style="italic" fill="#000000" opacity="0.95" letter-spacing="1">
      Eller's
    </text>
    <text x="2" y="2" text-anchor="middle" font-family="'Brush Script MT', 'Outfit', 'Plus Jakarta Sans', cursive, sans-serif" font-size="86" font-weight="900" font-style="italic" fill="#991b1b" opacity="0.8" letter-spacing="1">
      Eller's
    </text>
    <!-- Crisp White Foreground -->
    <text x="0" y="0" text-anchor="middle" font-family="'Brush Script MT', 'Outfit', 'Plus Jakarta Sans', cursive, sans-serif" font-size="86" font-weight="900" font-style="italic" fill="#ffffff" letter-spacing="1" filter="url(#softGlow)">
      Eller's
    </text>
    <!-- Brush highlight slashes on "E" and "ll" -->
    <path d="M -110 -55 Q -80 -65 -60 -45" stroke="#f4f4f5" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M 60 -50 Q 80 -65 95 -45" stroke="#f4f4f5" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>

  <!-- SUB-TYPOGRAPHY: "BURGUER" (Heavy red distressed sans-serif block) -->
  <g transform="translate(250, 328)">
    <!-- Black Drop Shadow -->
    <text x="3" y="4" text-anchor="middle" font-family="'Impact', 'Outfit', 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="#000000" letter-spacing="4">
      BURGUER
    </text>
    <!-- Main Red Text -->
    <text x="0" y="0" text-anchor="middle" font-family="'Impact', 'Outfit', 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="url(#redTextGrad)" letter-spacing="4" filter="url(#softGlow)">
      BURGUER
    </text>

    <!-- Speed Scratches / Distressed lines across BURGUER -->
    <line x1="-165" y1="-8" x2="165" y2="-8" stroke="#000000" stroke-width="2" opacity="0.4" />
    <line x1="-155" y1="3" x2="175" y2="3" stroke="#ffffff" stroke-width="1.2" opacity="0.3" />
    <line x1="-140" y1="-18" x2="150" y2="-18" stroke="#000000" stroke-width="1.5" opacity="0.3" />
  </g>

  <!-- BOTTOM SLOGAN BANNER ARC: "• O ARTESANAL DO JEITO CERTO. •" with Star -->
  <!-- Subtle arc guide line -->
  <path d="M 125 385 A 155 155 0 0 0 375 385" fill="none" stroke="#71717a" stroke-width="1" opacity="0.4" />

  <!-- Center Red Star -->
  <g transform="translate(250, 396)">
    <!-- Glow -->
    <circle cx="0" cy="0" r="10" fill="#ef4444" opacity="0.3" filter="url(#softGlow)" />
    <!-- 5-Point Star -->
    <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#ef4444" stroke="#f87171" stroke-width="0.8" />
  </g>

  <!-- Slogan text curved along the bottom arc -->
  <text fill="#ffffff" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" letter-spacing="3" text-anchor="middle">
    <textPath href="#bottomArcPath" startOffset="50%">
      • O ARTESANAL DO JEITO CERTO. •
    </textPath>
  </text>
</svg>
